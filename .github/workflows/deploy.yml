name: Deploy Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-roomflow
  AZURE_LOCATION: northeurope
  PREFIX: roomflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test API
        run: >
          dotnet test backend/RoomFlow.Application.Tests/RoomFlow.Application.Tests.csproj
          --configuration Release
          --nologo
          --logger GitHubActions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test frontend
        working-directory: frontend
        env:
          CI: true
        run: |
          npm ci
          npm run test:ci

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: az group create --name "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION"

      - name: Deploy platform
        id: platform
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_PRINCIPAL_ID: ${{ secrets.AZURE_PRINCIPAL_ID }}
        run: |
          set -euo pipefail

          if [ -n "${AZURE_PRINCIPAL_ID}" ]; then
            DEPLOYER_PRINCIPAL_ID="$AZURE_PRINCIPAL_ID"
          else
            DEPLOYER_PRINCIPAL_ID=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv)
          fi

          if [ -z "$DEPLOYER_PRINCIPAL_ID" ]; then
            echo "Missing Azure principal object ID. Set GitHub secret AZURE_PRINCIPAL_ID (az ad sp show --id <AZURE_CLIENT_ID> --query id -o tsv)."
            exit 1
          fi

          az deployment group create \
            --name platform \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/platform.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              prefix="$PREFIX" \
              sqlAdminPassword="$SQL_ADMIN_PASSWORD" \
              deployerPrincipalId="$DEPLOYER_PRINCIPAL_ID" \
            --query properties.outputs -o json > platform-outputs.json

          {
            echo "acrName=$(jq -r '.acrName.value' platform-outputs.json)"
            echo "acrLoginServer=$(jq -r '.acrLoginServer.value' platform-outputs.json)"
            echo "identityId=$(jq -r '.identityId.value' platform-outputs.json)"
            echo "identityClientId=$(jq -r '.identityClientId.value' platform-outputs.json)"
            echo "identityName=$(jq -r '.identityName.value' platform-outputs.json)"
            echo "environmentId=$(jq -r '.environmentId.value' platform-outputs.json)"
            echo "sqlFqdn=$(jq -r '.sqlFqdn.value' platform-outputs.json)"
            echo "sqlDatabaseName=$(jq -r '.sqlDatabaseName.value' platform-outputs.json)"
            echo "sqlServerName=$(jq -r '.sqlServerName.value' platform-outputs.json)"
            echo "sqlAdminLogin=$(jq -r '.sqlAdminLogin.value' platform-outputs.json)"
            echo "swaName=$(jq -r '.swaName.value' platform-outputs.json)"
            echo "swaHostname=$(jq -r '.swaHostname.value' platform-outputs.json)"
            echo "appInsightsName=$(jq -r '.appInsightsName.value' platform-outputs.json)"
            echo "keyVaultName=$(jq -r '.keyVaultName.value' platform-outputs.json)"
            echo "keyVaultUri=$(jq -r '.keyVaultUri.value' platform-outputs.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Seed Key Vault secrets
        env:
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          KV_NAME: ${{ steps.platform.outputs.keyVaultName }}
        run: |
          set -euo pipefail

          set_secret() {
            local name="$1"
            local value="$2"
            local i
            for i in 1 2 3 4 5 6 7 8; do
              if az keyvault secret set --vault-name "$KV_NAME" --name "$name" --value "$value" --output none; then
                return 0
              fi
              echo "Key Vault RBAC not ready yet (attempt $i), retrying in 15s..."
              sleep 15
            done
            echo "Failed to set secret $name"
            return 1
          }

          set_secret jwt-signing-key "$JWT_SIGNING_KEY"
          set_secret sql-admin-password "$SQL_ADMIN_PASSWORD"

      - name: Login to ACR
        run: az acr login --name "${{ steps.platform.outputs.acrName }}"

      - name: Build and push API image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "${{ steps.platform.outputs.acrLoginServer }}/roomflow-api:${{ github.sha }}" \
            backend
          docker push \
            "${{ steps.platform.outputs.acrLoginServer }}/roomflow-api:${{ github.sha }}"

      - name: Grant SQL access to managed identity
        id: sql-grant
        env:
          SQL_SERVER_NAME: ${{ steps.platform.outputs.sqlServerName }}
          SQL_FQDN: ${{ steps.platform.outputs.sqlFqdn }}
          SQL_DATABASE: ${{ steps.platform.outputs.sqlDatabaseName }}
          IDENTITY_NAME: ${{ steps.platform.outputs.identityName }}
        run: |
          set -euo pipefail

          if [[ ! "$IDENTITY_NAME" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "Unexpected managed identity name: $IDENTITY_NAME"
            exit 1
          fi

          RUNNER_IP=$(curl -4 -s https://api.ipify.org)
          RULE_NAME="gha-${GITHUB_RUN_ID}"
          echo "ruleName=$RULE_NAME" >> "$GITHUB_OUTPUT"

          az sql server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

          curl -fsSL -o sqlcmd.tar.bz2 \
            https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2
          tar -xjf sqlcmd.tar.bz2
          chmod +x sqlcmd
          sudo mv sqlcmd /usr/local/bin/sqlcmd
          rm -f sqlcmd.tar.bz2

          SQL="IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = N'${IDENTITY_NAME}')
            CREATE USER [${IDENTITY_NAME}] FROM EXTERNAL PROVIDER;
            IF NOT EXISTS (
              SELECT 1
              FROM sys.database_role_members drm
              INNER JOIN sys.database_principals r ON drm.role_principal_id = r.principal_id
              INNER JOIN sys.database_principals m ON drm.member_principal_id = m.principal_id
              WHERE r.name = N'db_owner' AND m.name = N'${IDENTITY_NAME}'
            )
            ALTER ROLE db_owner ADD MEMBER [${IDENTITY_NAME}];"

          for i in 1 2 3 4 5 6 7 8; do
            if sqlcmd -S "$SQL_FQDN" -d "$SQL_DATABASE" --authentication-method ActiveDirectoryAzureCLI -b -Q "$SQL"; then
              exit 0
            fi
            echo "Entra admin or SQL user not ready yet (attempt $i), retrying in 15s..."
            sleep 15
          done

          echo "Failed to grant SQL access to $IDENTITY_NAME"
          exit 1

      - name: Remove GitHub runner SQL firewall rule
        if: always() && steps.sql-grant.outcome != 'skipped'
        env:
          SQL_SERVER_NAME: ${{ steps.platform.outputs.sqlServerName }}
          RULE_NAME: ${{ steps.sql-grant.outputs.ruleName }}
        run: |
          if [ -n "${RULE_NAME:-}" ]; then
            az sql server firewall-rule delete \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server "$SQL_SERVER_NAME" \
              --name "$RULE_NAME" \
              --yes || true
          fi

      - name: Deploy API
        id: api
        run: |
          az deployment group create \
            --name api \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/api.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              prefix="$PREFIX" \
              environmentId="${{ steps.platform.outputs.environmentId }}" \
              acrLoginServer="${{ steps.platform.outputs.acrLoginServer }}" \
              identityId="${{ steps.platform.outputs.identityId }}" \
              identityClientId="${{ steps.platform.outputs.identityClientId }}" \
              apiImage="${{ steps.platform.outputs.acrLoginServer }}/roomflow-api:${{ github.sha }}" \
              keyVaultUri="${{ steps.platform.outputs.keyVaultUri }}" \
              sqlFqdn="${{ steps.platform.outputs.sqlFqdn }}" \
              sqlDatabaseName="${{ steps.platform.outputs.sqlDatabaseName }}" \
              corsOrigin="https://${{ steps.platform.outputs.swaHostname }}" \
              appInsightsName="${{ steps.platform.outputs.appInsightsName }}" \
            --query properties.outputs -o json > api-outputs.json

          echo "apiFqdn=$(jq -r '.apiFqdn.value' api-outputs.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          API_BASE_URL: https://${{ steps.api.outputs.apiFqdn }}
        run: |
          printf "export const environment = {\n  apiBaseUrl: '%s',\n};\n" "$API_BASE_URL" > src/environments/environment.prod.ts
          cp src/environments/environment.prod.ts src/environments/environment.ts
          npm ci
          npm run build

      - name: Read Static Web App token
        id: swa
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          TOKEN="$SWA_TOKEN"
          if [ -z "$TOKEN" ]; then
            TOKEN=$(az staticwebapp secrets list \
              --name "${{ steps.platform.outputs.swaName }}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.apiKey -o tsv)
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist/frontend/browser
          output_location: ''
          skip_app_build: true
          skip_api_build: true
