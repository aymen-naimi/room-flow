services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTPS_REDIRECT: "false"
      HttpsRedirection: "false"
      APPLY_MIGRATIONS: "true"
      ENABLE_SWAGGER: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RoomFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Issuer: ${JWT_ISSUER:-RoomFlow}
      Jwt__Audience: ${JWT_AUDIENCE:-RoomFlow}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__AccessTokenExpirationMinutes: "15"
      Jwt__RefreshTokenExpirationHours: "24"
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://localhost:4200
      AuthCookie__Secure: "false"
      AuthCookie__SameSite: Lax
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlserver_data:
